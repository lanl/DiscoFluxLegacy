name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.15"]
        toolchain:
          - {compiler: gcc, version: '10'}
          - {compiler: gcc, version: '11'}
          - {compiler: gcc, version: 'latest'}
          - {compiler: intel, version: '2024.1'}
          - {compiler: intel, version: 'latest'}
          #~ - {compiler: nvidia-hpc, version: 'latest'}
          - {compiler: lfortran, version: '0.68.0'}
          #~ - {compiler: aocc, version: 'latest'}
        exclude:
          - os: ubuntu-latest
            toolchain: {compiler: gcc, version: '11'}
          #~ - os: macos-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: macos-latest
            #~ toolchain: {compiler: aocc}
          #~ - os: macos-latest
            #~ toolchain: {compiler: intel}
          #~ - os: macos-latest
            #~ toolchain: {compiler: gcc, version: '10'}
          - os: windows-latest
            toolchain: {compiler: intel}
          - os: windows-latest
            toolchain: {compiler: gcc, version: '10'}
          - os: windows-latest
            toolchain: {compiler: lfortran}
        include:
          - python-version: '3.15'
            module-versions: "numpy scipy matplotlib pandas pytest"
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: 'current'
      #~ - name: Install Reference BLAS
        #~ run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev
        #~ if: runner.os == 'Linux'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.module-versions }}
      - name: Run tests
        run: |
          fpm test --compiler ${{ env.FC }} 
          pytest -s --durations=0 tests
