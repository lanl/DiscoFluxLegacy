name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.py'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.15"]
        toolchain:
          - {compiler: gcc, version: '10'}
          - {compiler: gcc, version: '12'}
          - {compiler: gcc, version: 'latest'}
          - {compiler: intel, version: '2024.1'}
          - {compiler: intel, version: '2025.3'}
          - {compiler: intel, version: 'latest'}
          #~ - {compiler: nvidia-hpc, version: 'latest'}
          - {compiler: lfortran, version: '0.68.0'}
          - {compiler: flang, version: '22'}
          - {compiler: flang, version: '23'}
          #~ - {compiler: aocc, version: 'latest'}
        exclude:
          #~ - os: macos-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: macos-latest
            #~ toolchain: {compiler: aocc}
          - os: macos-latest
            toolchain: {compiler: intel}
          - os: macos-latest
            toolchain: {compiler: gcc, version: '10'}
          - os: windows-latest
            toolchain: {compiler: intel, version: '2024.1'}
          - os: windows-latest
            toolchain: {compiler: gcc, version: '10'}
        include:
          - python-version: '3.15'
            module-versions: "numpy scipy matplotlib pandas pytest"
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v2.0.0-beta.17
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v11
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: 'current
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.module-versions }}
      - name: Run tests MacOS
        #shell: bash
        run: |
          fpm test --compiler ${{ env.FC }}
          pytest -s --durations=0 tests
        if: runner.os == 'MacOS'
      - name: Run tests
        run: |
          fpm test --compiler ${{ env.FC }}
          pytest -s --durations=0 tests
        if: runner.os != 'MacOS'
