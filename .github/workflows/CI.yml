name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.py'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]
        python-version: ["3.15"]
        toolchain:
          - {compiler: gfortran, version: '11'}
          - {compiler: gfortran, version: 'latest'}
          - {compiler: ifx, version: '2024.1'}
          #- {compiler: ifx, version: '2025.3'}
          - {compiler: ifx, version: 'latest'}
          #- {compiler: nvfortran, version: 'latest'}
          - {compiler: lfortran, version: '0.68.0'}
          - {compiler: flang, version: '22'}
          - {compiler: flang, version: 'latest'}
          #- {compiler: aocc, version: 'latest'}
        exclude:
          - os: macos-latest
            toolchain: {compiler: gfortran, version: '11'}
          - os: macos-latest
            toolchain: {compiler: flang, version: '22'}
          #- os: macos-latest
          #  toolchain: {compiler: aocc}
          - os: macos-latest
            toolchain: {compiler: ifx}
          - os: windows-2025
            toolchain: {compiler: lfortran}
          - os: windows-2025
            toolchain: {compiler: ifx}
          #- os: windows-2025
          #  toolchain: {compiler: aocc}
        include:
          - python-version: '3.15'
            module-versions: "numpy scipy matplotlib pandas pytest"
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v2.0.0-beta.17
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v11
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: 'current'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.module-versions }}
      - name: Run tests
        run: |
          fpm --version
          ${{ env.FC }}  --version
          fpm test --compiler ${{ env.FC }}
          pytest -s --durations=0 tests
