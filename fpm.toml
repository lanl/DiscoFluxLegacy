name = "DiscoFlux_Legacy"
version = "2026.10.21"
license = "BSD-3"
author = "Darby J. Luscher, Jason R. Mayeur, Hashem Mourad, Abigail Hunter, Mark A. Kenamond, Daniel N. Blaschke"
maintainer = "40176390+dblaschke-LANL@users.noreply.github.com"
copyright = "Copyright 2026, Triad National Security, LLC"
homepage = "https://github.com/lanl/DiscoFluxLegacy/"

#[fortran]
#source-form = "default"
#implicit-external = true

#[build]
#link = ["lapack", "blas"]

[dependencies]
stdlib = "*"
#blas = "*"
openmp = "*"

#[dev-dependencies]
#test-drive.git = "https://github.com/fortran-lang/test-drive"
#test-drive.tag = "v0.6.1"

[features]
baseline.gfortran.flags = "-O3 -march=native -std=f2018"
baseline.flang.flags = "-O3 -march=native -std=f2018"
baseline.lfortran.flags = "--fast --legacy-array-sections --realloc-lhs-arrays --std=f23"

[profiles]
default = ["baseline"]

#[library]
#type = ["shared", "static"]
#source-dir = "src"

[[executable]]
name = "impactshear"
source-dir = "app"
main = "impactshear.f90"

[[test]]
name = "runtests"
source-dir = "tests"
main = "runtests.f90"

#[install]
#library = true

[extra.ford]
project = "" ## we include the README.md file in the ford-docs for this and other info, see ford.yml
year = "2014-2026"
project_github  = "https://github.com/lanl/DiscoFluxLegacy"
src_dir = ["./src","./app"]
graph = true
incl_src = false
