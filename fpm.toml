name = "DiscoFlux_Legacy"
version = "2026.11.16"
license = "BSD-3"
author = "Darby J. Luscher, Jason R. Mayeur, Hashem Mourad, Abigail Hunter, Mark A. Kenamond, Daniel N. Blaschke"
maintainer = "40176390+dblaschke-LANL@users.noreply.github.com"
copyright = "Copyright 2026, Triad National Security, LLC"
homepage = "https://github.com/lanl/DiscoFluxLegacy/"

[dependencies]
stdlib = "*"
openmp = "*"
dislocdynlib.git = "https://github.com/dblaschke-lanl/pydislocdyn"
#dislocdynlib.tag = "1.4.1"

#[dev-dependencies]
#test-drive.git = "https://github.com/fortran-lang/test-drive"
#test-drive.tag = "v0.6.1"

[features]
baseline.gfortran.flags = "-O3 -march=native -std=f2018"
#baseline.gfortran.flags = "-O0 -Wall -pedantic -Wextra -std=f2023 -finit-real=snan -ffpe-trap=invalid,zero,overflow -g -fbacktrace -Wmaybe-uninitialized"
baseline.flang.flags = "-O3 -march=native -std=f2018"
baseline.lfortran.flags = "--legacy-array-sections --realloc-lhs-arrays --std=f23" ## flag --fast is causing issues
baseline.ifx.flags = "-O3 -heap-arrays 1000 -stand f18 -fp-model=strict"
#baseline.ifx.flags = "-O0 -heap-arrays -stand f23 -g -fpe0 -traceback -check-all -init=snan,arrays -fp-model=strict" 

[profiles]
default = ["baseline"]

#[library]
#type = ["shared", "static"]
#source-dir = "src"

[[executable]]
name = "impactshear"
source-dir = "app"
main = "impactshear.f90"

[[test]]
name = "runtests"
source-dir = "tests"
main = "runtests.f90"

#[install]
#library = true

[extra.ford]
project = "___" ## we include the README.md file in the ford-docs for this and other info, see ford.yml
year = "2014-2026"
project_github  = "https://github.com/lanl/DiscoFluxLegacy"
src_dir = ["./src","./app"]
graph = true
incl_src = false

[extra.fortitude.check]
line-length = 132
ignore = [
    "S291", # trailing decimal point
    "S233", # incorrect-keyword-case
    "S241", # string uses single quotes but double quotes preferred
    "S081", # superfluous-semicolon
    "C003", # 'implicit none' missing 'external'
    "C121", # 'use' statement missing 'only' clause
    "MOD011", # array literal uses old-style syntax
    "PORT011", # real kind set with number literal
]

